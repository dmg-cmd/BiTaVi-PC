name: BiTaVi PC - Compilación y Empaquetado Multiplataforma

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar y Empaquetar
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (versión 20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de sintaxis JS
        run: npm run lint

      - name: Compilación de producción (Vite)
        run: npm run build

      - name: Generar paquetes de distribución
        run: npm run package

      - name: Subir artefactos de distribución
        uses: actions/upload-artifact@v4
        with:
          name: bitavi-pc-paquetes-${{ matrix.os }}
          path: release/*.zip
          retention-days: 14
